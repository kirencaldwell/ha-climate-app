set_hold:
  name: Hold a room
  description: Hold a room at a temperature and/or weight for a number of hours (what the wall screen's buttons do).
  fields:
    room_id:
      name: Room
      description: Room id, e.g. primary_bedroom.
      required: true
      example: primary_bedroom
      selector:
        text:
    temperature:
      name: Temperature
      description: Target in °F.
      selector:
        number:
          min: 55
          max: 85
          unit_of_measurement: "°F"
    weight:
      name: Weight
      description: How much the room's comfort counts against the others (0.5 to 100).
      selector:
        number:
          min: 0.5
          max: 100
          step: 0.5
    hours:
      name: Hours
      description: How long to hold, in hours.
      selector:
        number:
          min: 0.25
          max: 72
          unit_of_measurement: h
clear_hold:
  name: Clear a hold
  description: Remove a room's hold.
  fields:
    room_id:
      name: Room
      required: true
      selector:
        text:
